name: CI

# Build, lint, test, cross-compile and security-scan on every push/PR.
on:
  push:
    branches: [main, master, workbody]
  pull_request:
    branches: [main, master, workbody]

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # P0: Build gate — MUST pass before any other job runs.
  # This is the hard gate that prevents broken code from merging.
  build-gate:
    name: Build gate (go build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build ./...
        run: go build ./...
      - name: go vet
        run: go vet ./...

  lint:
    name: Lint (golangci-lint)
    needs: build-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  # P2: Test gate — hard gate (no continue-on-error).
  #
  # Same scope as what a contributor runs locally (`go test ./...`), plus -race.
  # This repository has no `//go:build integration` files and no `testing.Short()`
  # branches, so there is no short/full split to honour: passing `-short` here
  # would exclude nothing while implying a tier that does not exist. If a future
  # test needs an external service, gate it behind a build tag and enable it in
  # the soft-gate job below — do not reintroduce a no-op flag.
  #
  # -count=1 disables the test result cache: a cached PASS from an earlier run
  # cannot vouch for the current one, and flaky tests hide behind cache hits.
  test-unit:
    name: Unit tests (with coverage)
    needs: build-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run test suite
        run: go test -race -count=1 -timeout 25m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # P2: Second run — soft gate (continue-on-error).
  #
  # Deliberately overlaps with the hard gate above. Two reasons it earns its
  # minutes rather than duplicating them:
  #   1. Flaky detection. A race that fails one run in three passes a single
  #      run two times out of three; an independent second run doubles the
  #      chance of catching it before a contributor does. This is not
  #      hypothetical — BACKLOG P5-1 was exactly that failure mode, and it took
  #      three consecutive local runs to reproduce.
  #   2. Browser environment. Chrome is installed here, so any test that grows a
  #      real chromedp dependency fails visibly instead of silently skipping.
  #      (Today `browser_login_test.go` only validates allocator options and
  #      never launches a browser.)
  # Soft gate on purpose: a second-run failure is a signal to investigate, not a
  # reason to block a PR whose hard gate is green.
  test-integration:
    name: Integration tests
    needs: build-gate
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Chrome for chromedp tests
        run: |
          # Install Chrome (or fall back to Chromium) for integration tests.
          # --batch --yes prevents gpg from trying to open /dev/tty (absent in CI).
          set -e
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || {
            echo "Chrome install failed; falling back to Chromium"
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          }
      - name: Run test suite again (independent run)
        run: go test -race -count=1 -timeout 30m ./...

  build:
    name: Build (linux/amd64)
    needs: build-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: go build -ldflags="-s -w" -trimpath -o openmodelpool .
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: openmodelpool-linux-amd64
          path: openmodelpool
          retention-days: 7

  cross-build:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('-{0}', matrix.goarm) }})
    needs: build-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: linux,  goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="openmodelpool-${GOOS}-${GOARCH}"
          if [ "${GOARCH}" = "arm" ]; then name="${name}v${GOARM}"; fi
          go build -ldflags="-s -w" -trimpath -o "${name}${ext}" .

  security:
    name: Security scan
    needs: build-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec.sarif
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          govulncheck ./...
