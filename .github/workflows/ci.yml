name: CI

# Build, lint, test, cross-compile and security-scan on every push/PR.
on:
  push:
    branches: [main, master, workbody]
  pull_request:
    branches: [main, master, workbody]

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # P0: Build gate — MUST pass before any other job runs.
  # This is the hard gate that prevents broken code from merging.
  build-gate:
    name: Build gate (go build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go build ./...
        run: go build ./...
      - name: go vet
        run: go vet ./...

  lint:
    name: Lint (golangci-lint)
    needs: build-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # P2: Unit tests — hard gate (no continue-on-error).
  # Runs only short tests (excludes integration tests tagged with //go:build integration).
  test-unit:
    name: Unit tests (with coverage)
    needs: build-gate
    # NOTE: pre-existing test failures (geo-IP, rate limiter, auth, file-integrity)
    # still exist. continue-on-error will be removed once these are fixed.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test -race -short -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # P2: Integration tests — soft gate (continue-on-error).
  # Runs full test suite including chromedp and network-dependent tests.
  # These may fail due to environment issues and should not block merges.
  test-integration:
    name: Integration tests
    needs: build-gate
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Chrome for chromedp tests
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - name: Run integration tests
        run: go test -race -timeout 30m ./...
        env:
          OMP_TEST_INTEGRATION: "1"

  build:
    name: Build (linux/amd64)
    needs: build-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: go build -ldflags="-s -w" -trimpath -o openmodelpool .
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: openmodelpool-linux-amd64
          path: openmodelpool
          retention-days: 7

  cross-build:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('-{0}', matrix.goarm) }})
    needs: build-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: linux,  goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="openmodelpool-${GOOS}-${GOARCH}"
          if [ "${GOARCH}" = "arm" ]; then name="${name}v${GOARM}"; fi
          go build -ldflags="-s -w" -trimpath -o "${name}${ext}" .

  security:
    name: Security scan
    needs: build-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec.sarif
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.3
          govulncheck ./...
