name: Bug report
description: Something is broken or behaves differently from the docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. A report that reproduces is worth
        ten that don't — please include the steps.

        **Security issue?** Do not file it here. See [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        I called /v1/chat/completions with ... and expected ... but got ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the binary with this config ...
        2. Send this request ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `GET /api/version`, or the release tag / commit you built from.
      placeholder: "4.3.29"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Node mode
      options:
        - personal
        - shared / federation
        - not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: "Linux amd64 / macOS arm64 / Windows amd64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. Redact API keys and tokens first.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed any API keys, tokens, or other secrets from the report
          required: true
